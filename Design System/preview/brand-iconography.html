<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #fbfbf9; font-family: 'Geist', sans-serif; }
  .card { padding: 22px 28px; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .ic { color: #1a1a1a; }
  .nm { font-family: 'Geist Mono', monospace; font-size: 10px; color: #888; }
  .desc {
    flex: 1; min-width: 220px;
    font-size: 12px; color: #555; line-height: 1.5;
  }
  .desc b { color: #1a1a1a; font-weight: 500; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; }
  .sizes svg { color: #1a1a1a; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">Iconography — Lucide, 1.5px stroke, outline only</div>
    <div class="row">
      <div class="item">
        <!-- arrow-right -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <div class="nm">arrow-right</div>
      </div>
      <div class="item">
        <!-- moon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <div class="nm">moon</div>
      </div>
      <div class="item">
        <!-- sun -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <div class="nm">sun</div>
      </div>
      <div class="item">
        <!-- mail -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <div class="nm">mail</div>
      </div>
      <div class="item">
        <!-- calendar -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <div class="nm">calendar</div>
      </div>
      <div class="item">
        <!-- github -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        <div class="nm">github</div>
      </div>
      <div class="item">
        <!-- arrow-up-right -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        <div class="nm">arrow-up-right</div>
      </div>
      <div class="desc">All from <b>Lucide</b> (lucide.dev). 1.5px stroke, outline only. No filled, no duotone, no colored icons. Substitution flag — Karim hasn't confirmed.</div>
    </div>
  </div>
</body>
</html>
