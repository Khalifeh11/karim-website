<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technical — palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #fbfbf9; font-family: 'Geist', sans-serif; }
  .card { padding: 22px 28px; gap: 14px; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { aspect-ratio: 1.4 / 1; border-radius: 6px; border: 1px solid rgba(0,0,0,0.06); }
  .nm { font-size: 10px; color: #666; font-family: 'Geist Mono', monospace; }
  .head { display: flex; gap: 18px; align-items: baseline; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="label" style="color:#0e0e0e;font-weight:500">B · Technical</div>
      <div class="label">near-white · near-black · electric blue</div>
    </div>
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:oklch(0.985 0.002 85)"></div><div class="nm">bg</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.96 0.003 85)"></div><div class="nm">surface-2</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.92 0.003 80)"></div><div class="nm">border</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.58 0.004 70)"></div><div class="nm">fg-3</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.42 0.005 70)"></div><div class="nm">fg-2</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.16 0.005 70)"></div><div class="nm">fg</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.62 0.20 248)"></div><div class="nm">accent</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.56 0.21 248)"></div><div class="nm">accent-hover</div></div>
    </div>
  </div>
</body>
</html>
