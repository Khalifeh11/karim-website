<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modern — palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  html, body { background: oklch(0.155 0.008 150); color: oklch(0.97 0.012 95); }
  body { font-family: 'Geist', sans-serif; }
  .card { padding: 22px 28px; gap: 14px; text-transform: lowercase; }
  .label { color: oklch(0.55 0.012 115); }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { aspect-ratio: 1.4 / 1; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
  .nm { font-size: 10px; color: oklch(0.74 0.010 100); font-family: 'Geist Mono', monospace; }
  .head { display: flex; gap: 18px; align-items: baseline; }
  .head b { color: oklch(0.97 0.012 95); font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="label"><b>a · modern (dark default)</b></div>
      <div class="label">forest base · accent forest-bright</div>
    </div>
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:oklch(0.155 0.008 150)"></div><div class="nm">bg</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.19 0.010 148)"></div><div class="nm">bg-elev</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.235 0.012 148)"></div><div class="nm">surface-2</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.27 0.012 145)"></div><div class="nm">border</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.55 0.012 115)"></div><div class="nm">fg-3</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.97 0.012 95)"></div><div class="nm">fg</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.80 0.11 148)"></div><div class="nm">accent</div></div>
      <div class="sw"><div class="chip" style="background:oklch(0.40 0.07 148)"></div><div class="nm">accent-soft</div></div>
    </div>
  </div>
</body>
</html>
