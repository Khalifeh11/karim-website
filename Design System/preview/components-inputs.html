<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #fbfbf9; font-family: 'Geist', sans-serif; }
  .card { padding: 22px 28px; gap: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; align-items: end; }
  .f { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; color: #555; letter-spacing: 0.04em; }
  input, textarea {
    font-family: inherit; font-size: 13px; padding: 9px 12px; border-radius: 6px;
    border: 1px solid #d8d8d6; background: #fff; color: #1a1a1a; outline: none;
    transition: border-color 150ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  input.focus { border-color: oklch(0.45 0.13 30); box-shadow: 0 0 0 3px oklch(0.45 0.13 30 / 0.15); }
  textarea { resize: none; height: 56px; }
  .ta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">Form inputs — text, email, textarea + focus</div>
    <div class="grid">
      <div class="f"><label>name</label><input value="Karim Khalifeh"></div>
      <div class="f"><label>email</label><input class="focus" value="hi@karim.dev"></div>
      <div class="f"><label>budget</label><input placeholder="select…" value=""></div>
    </div>
    <div class="f">
      <label>project description</label>
      <textarea>Rebuilding our marketing site. Need it fast, well-engineered, and shipped in 6 weeks. Stack flexible.</textarea>
    </div>
  </div>
</body>
</html>
